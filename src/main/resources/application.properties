spring.application.name=smart-cafeteria

# Database (credentials come from environment variables, never from Git)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_cafeteria?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only validates it (SDS section 2)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Times stored in UTC, shown in campus timezone (SDS section 5)
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.display-timezone=Africa/Nairobi

# Sessions (FR-004, NFR-03)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Health check reveals status only, no details (SDS section 9)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Never show stack traces to users
server.error.include-stacktrace=never
server.error.include-message=never

# Menu photo uploads: the app also checks the real file type and shrinks every photo
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# Browsers may keep fonts, styles and scripts for a week (turned off in the dev profile)
spring.web.resources.cache.cachecontrol.max-age=7d

# Address printed inside table QR codes. Leave empty to use the address the administrator is browsing from.
# For phone testing set it to your computer's address, for example http://192.168.1.20:8080
app.public-base-url=${PUBLIC_BASE_URL:}

# Limits on abuse (Sprint 6). In memory, so counts restart with the application.
# Sign-in: this many failed attempts from one address inside the window blocks that address until the oldest one expires.
app.rate-limit.login.max-failures=10
app.rate-limit.login.window-minutes=15
# Orders: this many orders from one student inside the window, then they are asked to wait.
app.rate-limit.orders.max=5
app.rate-limit.orders.window-minutes=10

# HTTPS is required only in the prod and behind-proxy profiles (see docs/https-and-limits.md)
app.require-https=false

# Session ids only ever travel in the cookie, never in a web address
server.servlet.session.tracking-modes=cookie
