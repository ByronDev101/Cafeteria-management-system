spring.application.name=smart-cafeteria

# Database (credentials come from environment variables, never from Git)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_cafeteria?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only validates it (SDS section 2)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Times stored in UTC, shown in campus timezone (SDS section 5)
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.display-timezone=Africa/Nairobi

# Sessions (FR-004, NFR-03)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Health check reveals status only, no details (SDS section 9)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Never show stack traces to users
server.error.include-stacktrace=never
server.error.include-message=never
