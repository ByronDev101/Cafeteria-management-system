# Production with Spring Boot serving HTTPS itself. Run with: --spring.profiles.active=prod
# Nothing secret is written here: the certificate file and its password come from environment variables.
app.require-https=true
server.port=${PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:smartcafeteria}
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.servlet.session.cookie.secure=true
