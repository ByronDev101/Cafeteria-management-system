<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Smart Cafeteria'">Item - Smart Cafeteria</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<th:block th:replace="~{fragments/manager-nav :: nav}"/>
<main class="container py-4 form-wrap">
    <h1 class="h3 fw-bold mb-3" th:text="${title}">Item</h1>

    <div th:if="${errors}" class="alert alert-danger" role="alert">
        <ul class="mb-0"><li th:each="e : ${errors}" th:text="${e}"></li></ul>
    </div>

    <form th:action="@{${formAction}}" method="post" enctype="multipart/form-data" class="card card-body shadow-sm">
        <div class="mb-3">
            <label for="categoryId" class="form-label fw-semibold">Category</label>
            <select id="categoryId" name="categoryId" class="form-select" required>
                <option th:each="c : ${categories}" th:value="${c.publicId}" th:text="${c.name}"
                        th:selected="${c.publicId == categoryId}">Category</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Name</label>
            <input id="name" name="name" type="text" class="form-control" required maxlength="100"
                   autocomplete="off" th:value="${name}">
        </div>
        <div class="mb-3">
            <label for="description" class="form-label fw-semibold">Description (optional)</label>
            <input id="description" name="description" type="text" class="form-control" maxlength="500"
                   autocomplete="off" th:value="${description}">
        </div>
        <div class="row">
            <div class="col-sm-6 mb-3">
                <label for="price" class="form-label fw-semibold">Price (KSh)</label>
                <input id="price" name="price" type="text" inputmode="decimal" class="form-control" required
                       autocomplete="off" th:value="${price}">
                <div class="form-text">For example 150 or 150.50.</div>
            </div>
            <div class="col-sm-6 mb-3">
                <label for="prepMinutes" class="form-label fw-semibold">Prep time in minutes (optional)</label>
                <input id="prepMinutes" name="prepMinutes" type="number" min="1" max="180" class="form-control"
                       th:value="${prepMinutes}">
                <div class="form-text">Shown on the card. 10 or less counts as fast prep.</div>
            </div>
        </div>
        <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="vegetarian" name="vegetarian" value="true"
                       th:checked="${vegetarian}">
                <label class="form-check-label" for="vegetarian">Vegetarian</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="featured" name="featured" value="true"
                       th:checked="${featured}">
                <label class="form-check-label" for="featured">Today's special (shown in the banner, up to three)</label>
            </div>
        </div>
        <div class="mb-3">
            <label for="photo" class="form-label fw-semibold">Photo (optional)</label>
            <div class="mb-2" th:if="${current != null and current.imageVersion != null}">
                <img class="photo-preview" alt="Current photo"
                     th:src="@{/media/menu/{id}(id=${current.publicId},v=${current.imageVersion})}">
            </div>
            <input id="photo" name="photo" type="file" class="form-control" accept="image/jpeg,image/png">
            <div class="form-text">JPEG or PNG, up to 3 MB. It is resized and compressed automatically. Use photos you own or may use.</div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/manager/menu}">Cancel</a>
        </div>
    </form>

    <form class="mt-3" method="post" th:if="${current != null and current.imageVersion != null}"
          th:action="@{/manager/menu/items/{id}/photo/remove(id=${current.publicId})}">
        <button type="submit" class="btn btn-sm btn-outline-danger">Remove current photo</button>
    </form>
</main>
</body>
</html>
