<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audit log - Smart Cafeteria</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/admin-nav :: nav}"></div>
<main class="container py-4">
    <h1 class="h3 mb-1">Audit log</h1>
    <p class="text-secondary">Newest first. Times are in campus time (Africa/Nairobi).</p>

    <div class="table-responsive">
        <table class="table table-sm bg-white border">
            <thead>
            <tr><th>When</th><th>Who</th><th>Action</th><th>Target</th><th>Outcome</th><th>Details</th></tr>
            </thead>
            <tbody>
            <tr th:each="e : ${page.content}">
                <td class="text-nowrap" th:text="${e.when}">time</td>
                <td th:text="${e.actor}">actor</td>
                <td th:text="${e.action}">ACTION</td>
                <td th:text="${e.target}">USER id</td>
                <td th:text="${e.outcome}">SUCCESS</td>
                <td th:text="${e.details}">details</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between" th:if="${page.totalPages > 1}">
        <a th:if="${page.hasPrevious()}" class="btn btn-sm btn-outline-secondary"
           th:href="@{/admin/audit(page=${page.number - 1})}">Newer</a>
        <span class="text-secondary">Page <span th:text="${page.number + 1}">1</span>
            of <span th:text="${page.totalPages}">1</span></span>
        <a th:if="${page.hasNext()}" class="btn btn-sm btn-outline-secondary"
           th:href="@{/admin/audit(page=${page.number + 1})}">Older</a>
    </div>
</main>
</body>
</html>
