<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roles - Smart Cafeteria</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/admin-nav :: nav}"></div>
<main class="container py-4 form-wrap">
    <h1 class="h3 mb-1">Roles</h1>
    <p class="text-secondary">
        <strong th:text="${user.username}">user</strong> (<span th:text="${user.displayName}">Name</span>)
    </p>

    <form th:action="@{/admin/users/{id}/roles(id=${user.publicId})}" method="post" class="card card-body shadow-sm">
        <fieldset class="mb-3">
            <legend class="form-label fs-6">Roles</legend>
            <div class="form-check" th:each="r : ${roleNames}">
                <input class="form-check-input" type="checkbox" name="roles"
                       th:id="'role-' + ${r}" th:value="${r}" th:checked="${selected.contains(r)}">
                <label class="form-check-label" th:for="'role-' + ${r}" th:text="${r}">ROLE</label>
            </div>
        </fieldset>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save roles</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
