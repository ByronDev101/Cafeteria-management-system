<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Order ' + ${order.orderNumber} + ' - Smart Cafeteria'">Order - Smart Cafeteria</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/order-status.js}" defer></script>
</head>
<body>
<th:block th:replace="~{fragments/topbar :: bar('/student/menu', ${welcome}, ${today})}"/>
<main class="page-narrow" data-order-status
      th:attr="data-order-status=${order.statusCode},data-terminal=${order.terminal},data-poll-url=@{/student/orders/{id}/status(id=${order.publicId})}">

    <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>
    <div th:if="${errors}" class="alert alert-danger" role="alert">
        <ul class="mb-0"><li th:each="e : ${errors}" th:text="${e}"></li></ul>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-1">
        <h1 class="mb-0" th:text="${order.orderNumber}">SC-ABC123</h1>
        <span class="status-pill" th:classappend="'status-' + ${order.statusClass}" th:text="${order.statusLabel}">Submitted</span>
    </div>
    <p class="text-secondary">
        Placed <span th:text="${order.createdText}">1 Jan 2026, 12:00</span>
        for <strong th:text="${order.tableLabel}">Table 1</strong>
    </p>

    <section class="card card-body mb-4" aria-label="Order progress">
        <ol class="steps">
            <li class="step" th:each="s : ${order.steps}" th:classappend="'is-' + ${s.state}">
                <span class="step-dot" aria-hidden="true" th:text="${s.state == 'done'} ? '&#10003;' : (${s.state == 'cancelled'} ? '&#10005;' : '')"></span>
                <span>
                    <span class="step-label d-block" th:text="${s.label}">Submitted</span>
                    <span class="step-time" th:if="${s.timeText}" th:text="${s.timeText}">1 Jan 2026, 12:00</span>
                </span>
            </li>
        </ol>
        <p class="small text-secondary mt-3 mb-0" th:unless="${order.terminal}">This page updates by itself.</p>
    </section>

    <section class="card card-body mb-4" aria-label="Items">
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-2">
                <thead><tr><th>Item</th><th class="text-end">Qty</th><th class="text-end">Price</th><th class="text-end">Total</th></tr></thead>
                <tbody>
                <tr th:each="l : ${order.lines}">
                    <td th:text="${l.name}">Item</td>
                    <td class="text-end" th:text="${l.quantity}">1</td>
                    <td class="text-end text-nowrap" th:text="${l.unitPriceText}">KSh 0.00</td>
                    <td class="text-end text-nowrap" th:text="${l.lineTotalText}">KSh 0.00</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="cart-summary mb-1"><span>Total</span><span th:text="${order.totalText}">KSh 0.00</span></div>
        <p class="text-secondary small mb-0">Payment: <strong th:text="${order.paymentLabel}">Cash</strong></p>
    </section>

    <section th:if="${order.canCancel}" class="mb-4">
        <form method="post" th:action="@{/student/orders/{id}/cancel(id=${order.publicId})}">
            <button type="submit" class="btn btn-outline-danger">Cancel this order</button>
        </form>
        <p class="small text-secondary mt-2">You can cancel until staff accept your order.</p>
    </section>

    <p><a th:href="@{/student/orders}">All my orders</a> &middot; <a th:href="@{/student/menu}">Back to the menu</a></p>
</main>
</body>
</html>
