<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password - Smart Cafeteria</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<main class="container login-wrap">
    <h1 class="h3 mb-1">Change password</h1>
    <p class="text-secondary mb-4">
        Use at least 10 characters, with at least one letter and one digit.
        After saving, you will sign in again with the new password.
    </p>

    <div th:if="${errors}" class="alert alert-danger" role="alert">
        <ul class="mb-0"><li th:each="e : ${errors}" th:text="${e}"></li></ul>
    </div>

    <form th:action="@{/account/password}" method="post" class="card card-body shadow-sm">
        <div class="mb-3">
            <label for="currentPassword" class="form-label">Current password</label>
            <input id="currentPassword" name="currentPassword" type="password" class="form-control"
                   autocomplete="current-password" required autofocus>
        </div>
        <div class="mb-3">
            <label for="newPassword" class="form-label">New password</label>
            <input id="newPassword" name="newPassword" type="password" class="form-control"
                   autocomplete="new-password" required minlength="10" maxlength="72">
        </div>
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm new password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" class="form-control"
                   autocomplete="new-password" required minlength="10" maxlength="72">
        </div>
        <button type="submit" class="btn btn-primary w-100">Save new password</button>
    </form>

    <form th:action="@{/logout}" method="post" class="mt-3">
        <button type="submit" class="btn btn-link p-0">Sign out instead</button>
    </form>
</main>
</body>
</html>
