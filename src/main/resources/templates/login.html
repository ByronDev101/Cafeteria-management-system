<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - Smart Cafeteria</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-body">
<main class="auth-card">
    <div class="auth-brand">
        <span class="brand-mark" aria-hidden="true">SC</span>
        <span class="brand-copy"><span>Smart</span><strong>Cafeteria</strong></span>
    </div>
    <div class="auth-form">
        <h1>Welcome back</h1>
        <p class="text-secondary mb-4">Sign in to order from your table.</p>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Sign-in failed. Check your student number and password, then try again.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="status">
            You have signed out.
        </div>
        <div th:if="${param.expired}" class="alert alert-warning" role="status">
            Your sign-in page had expired. Please sign in again.
        </div>
        <div th:if="${param.changed}" class="alert alert-success" role="status">
            Your password has been changed. Sign in with your new password.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Student number</label>
                <input id="username" name="username" type="text" class="form-control form-control-lg"
                       autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input id="password" name="password" type="password" class="form-control form-control-lg"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Sign in</button>
        </form>
    </div>
</main>
</body>
</html>
