<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${area} + ' - Smart Cafeteria'">Area - Smart Cafeteria</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<main class="container login-wrap">
    <h1 class="h3" th:text="${area}">Area</h1>
    <p>Signed in as <strong th:text="${name}">user</strong>.</p>
    <p class="text-secondary" th:text="${note}">Note</p>
    <ul class="list-unstyled" th:if="${adminLinks}">
        <li><a th:href="@{/admin/users}">Accounts</a></li>
        <li><a th:href="@{/admin/audit}">Audit log</a></li>
    </ul>
    <p><a th:href="@{/account/password}">Change password</a></p>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-secondary">Sign out</button>
    </form>
</main>
</body>
</html>
