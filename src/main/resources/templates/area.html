<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${area} + ' - Smart Cafeteria'">Area - Smart Cafeteria</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<th:block th:replace="~{fragments/topbar :: bar('/', ${welcome}, ${today})}"/>
<main class="narrow">
    <h1 class="h3 fw-bold" th:text="${area}">Area</h1>
    <p class="text-secondary" th:text="${note}">Note</p>
    <div class="list-group mb-4">
        <a class="list-group-item list-group-item-action" th:if="${studentLinks}" th:href="@{/student/menu}">View menu</a>
        <a class="list-group-item list-group-item-action" th:if="${managerLinks}" th:href="@{/manager/menu}">Manage menu</a>
        <a class="list-group-item list-group-item-action" th:if="${adminLinks}" th:href="@{/admin/users}">Accounts</a>
        <a class="list-group-item list-group-item-action" th:if="${adminLinks}" th:href="@{/admin/audit}">Audit log</a>
        <a class="list-group-item list-group-item-action" th:href="@{/account/password}">Change password</a>
    </div>
</main>
</body>
</html>
