# Settings for the database integration tests (profile "it"). Nothing secret is stored here.
# The tests WIPE and rebuild this schema every run, so it must be a separate schema whose name ends in _test.
# Create it once:  CREATE DATABASE smart_cafeteria_test CHARACTER SET utf8mb4;
spring.datasource.url=${IT_DB_URL:jdbc:mysql://localhost:3307/smart_cafeteria_test?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${IT_DB_USER:${DB_USER:root}}
spring.datasource.password=${IT_DB_PASSWORD:${DB_PASSWORD:}}

# Optional: put your own login in src/test/resources/application-it-local.properties (it is ignored by Git):
#   spring.datasource.username=<database user>
#   spring.datasource.password=<database password>
# Anything in that file wins over the environment variables above.
spring.config.import=optional:classpath:application-it-local.properties

spring.flyway.clean-disabled=false
spring.jpa.hibernate.ddl-auto=validate

# Tests place many orders quickly for one student; the abuse limits are tested on their own.
app.rate-limit.orders.max=100000
app.rate-limit.login.max-failures=100000
